name: Fix Map Animations

on:
  push:
    paths:
      - 'scripts/patch_map_anim.py'
      - '.github/workflows/fix-map-animations.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run patch script
        run: python3 scripts/patch_map_anim.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/marketmaps/app/ui/map/MapScreen.kt \
                  app/src/main/java/com/marketmaps/app/ui/map/MarkerIconHelper.kt \
                  app/src/main/java/com/marketmaps/app/ui/map/StoreDetailsDialog.kt
          git diff --staged --stat
          git commit -m "fix: مزامنة البطاقة والزر، تقليل وميض الموقع، تسريع التمييز، تنعيم الزوم" || true
          git push
