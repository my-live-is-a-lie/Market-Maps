name: Fix Map Animations

on:
  push:
    paths:
      - '.github/workflows/fix-map-animations.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply patches
        run: |
          python3 << 'PY'
          from pathlib import Path

          p = Path('app/src/main/java/com/marketmaps/app/ui/map/MapScreen.kt')
          c = p.read_text(encoding='utf-8')

          old_h = '''    // تأثير نابض: تصغير خفيف ثم تكبير 20٪
    val highlightScaleAnim = remember { Animatable(1f) }
    LaunchedEffect(highlightedStoreId) {
        if (highlightedStoreId != null) {
            // حركة ناعمة وبطيئة قليلاً: تصغير خفيف جداً ثم تكبير هادئ
            highlightScaleAnim.snapTo(1f)
            highlightScaleAnim.animateTo(
                0.94f,
                animationSpec = tween(durationMillis = 140)
            )
            highlightScaleAnim.animateTo(
                1.18f,
                animationSpec = spring(
                    dampingRatio = 0.78f, // أقل اهتزازاً من MediumBouncy
                    stiffness = 280f       // أبطأ من الافتراضي
                )
            )
        } else {
            highlightScaleAnim.animateTo(
                1f,
                animationSpec = spring(
                    dampingRatio = 0.90f,
                    stiffness = 320f
                )
            )
        }
    }
    val highlightScale by highlightScaleAnim.asState()'''

          new_h = '''    // تأثير تمييز سريع
    val highlightScaleAnim = remember { Animatable(1f) }
    LaunchedEffect(highlightedStoreId) {
        if (highlightedStoreId != null) {
            highlightScaleAnim.snapTo(1f)
            highlightScaleAnim.animateTo(
                1.14f,
                animationSpec = spring(dampingRatio = 0.82f, stiffness = 900f)
            )
        } else {
            highlightScaleAnim.snapTo(1f)
        }
    }
    val highlightScale by highlightScaleAnim.asState()
    val highlightScaleBucket = ((highlightScale * 8f).toInt() / 8f)'''

          assert old_h in c, 'highlight not found'
          c = c.replace(old_h, new_h, 1)
          c = c.replace(
              'LaunchedEffect(mapViewRef, stores, userLat, userLon, mapProvider, highlightedStoreId, highlightScale)',
              'LaunchedEffect(mapViewRef, stores, userLat, userLon, mapProvider, highlightedStoreId, highlightScaleBucket)',
              1)
          c = c.replace(
              'mapViewRef?.let { addMarkersToMap(context, it, stores, userLat, userLon, highlightedStoreId, highlightScale) }',
              'mapViewRef?.let { addMarkersToMap(context, it, stores, userLat, userLon, highlightedStoreId, highlightScaleBucket) }',
              1)

          old_lift = '''            animationSpec = spring(\n                dampingRatio = Spring.DampingRatioNoBouncy,\n                stiffness = Spring.StiffnessMedium\n            )'''
          # only first occurrence in cardLift
          idx = c.find('LaunchedEffect(cardLiftTargetPx)')
          assert idx > 0
          sub = c[idx:idx+350]
          if 'StiffnessMedium' in sub:
              c = c[:idx] + sub.replace(
                  'stiffness = Spring.StiffnessMedium',
                  'stiffness = 700f',
                  1
              ) + c[idx+350:]
              print('cardLift stiffness updated')

          old_user = 'val userBmp = MarkerIconHelper.getUserLocationBitmap(mode)'
          new_user = 'val userBmp = MarkerIconHelper.getUserLocationBitmap(MarkerIconHelper.DisplayMode.BUBBLE_MEDIUM)'
          assert old_user in c
          c = c.replace(old_user, new_user, 1)

          old_add = '''        val mode = MarkerIconHelper.displayModeForZoom(zoom, centerLat)\n\n        if (mode != MarkerIconHelper.DisplayMode.HIDDEN) {\n            val ordered = if (highlightedStoreId == null) stores\n            else stores.sortedBy { if (it.id == highlightedStoreId) 1 else 0 }\n            ordered.forEach { store ->\n                try {\n                    val highlighted = highlightedStoreId != null && store.id == highlightedStoreId\n                    var androidBmp = MarkerIconHelper.getAndroidMarkerBitmap(store.category, mode)\n                        ?: return@forEach'''

          new_add = '''        val mode = MarkerIconHelper.displayModeForZoom(zoom, centerLat)\n        val zoomSize = MarkerIconHelper.sizeForZoom(zoom)\n\n        if (mode != MarkerIconHelper.DisplayMode.HIDDEN && zoomSize > 0) {\n            val ordered = if (highlightedStoreId == null) stores\n            else stores.sortedBy { if (it.id == highlightedStoreId) 1 else 0 }\n            ordered.forEach { store ->\n                try {\n                    val highlighted = highlightedStoreId != null && store.id == highlightedStoreId\n                    var androidBmp = MarkerIconHelper.getAndroidMarkerBitmap(store.category, mode)\n                        ?: return@forEach\n                    if (androidBmp.width != zoomSize && zoomSize > 0) {\n                        androidBmp = android.graphics.Bitmap.createScaledBitmap(\n                            androidBmp, zoomSize, zoomSize, true\n                        )\n                    }'''

          # Use actual newlines not escaped
          old_add = old_add.replace('\\n', '\n')
          new_add = new_add.replace('\\n', '\n')
          if old_add not in c:
              # try without double escape
              old_add2 = """        val mode = MarkerIconHelper.displayModeForZoom(zoom, centerLat)

        if (mode != MarkerIconHelper.DisplayMode.HIDDEN) {
            val ordered = if (highlightedStoreId == null) stores
            else stores.sortedBy { if (it.id == highlightedStoreId) 1 else 0 }
            ordered.forEach { store ->
                try {
                    val highlighted = highlightedStoreId != null && store.id == highlightedStoreId
                    var androidBmp = MarkerIconHelper.getAndroidMarkerBitmap(store.category, mode)
                        ?: return@forEach"""
              new_add2 = """        val mode = MarkerIconHelper.displayModeForZoom(zoom, centerLat)
        val zoomSize = MarkerIconHelper.sizeForZoom(zoom)

        if (mode != MarkerIconHelper.DisplayMode.HIDDEN && zoomSize > 0) {
            val ordered = if (highlightedStoreId == null) stores
            else stores.sortedBy { if (it.id == highlightedStoreId) 1 else 0 }
            ordered.forEach { store ->
                try {
                    val highlighted = highlightedStoreId != null && store.id == highlightedStoreId
                    var androidBmp = MarkerIconHelper.getAndroidMarkerBitmap(store.category, mode)
                        ?: return@forEach
                    if (androidBmp.width != zoomSize && zoomSize > 0) {
                        androidBmp = android.graphics.Bitmap.createScaledBitmap(
                            androidBmp, zoomSize, zoomSize, true
                        )
                    }"""
              assert old_add2 in c, 'addMarkers not found'
              c = c.replace(old_add2, new_add2, 1)
          else:
              c = c.replace(old_add, new_add, 1)

          p.write_text(c, encoding='utf-8')
          print('MapScreen OK')

          p2 = Path('app/src/main/java/com/marketmaps/app/ui/map/MarkerIconHelper.kt')
          c2 = p2.read_text(encoding='utf-8')
          old_mode = """    fun displayModeForZoom(zoom: Int, latitude: Double = 30.0): DisplayMode {
        val approxScaleMeters = metersPerPixel(latitude, zoom) * 100.0
        return when {
            approxScaleMeters <= 70 -> DisplayMode.BUBBLE_LARGE
            approxScaleMeters <= 140 -> DisplayMode.BUBBLE_MEDIUM
            approxScaleMeters <= 280 -> DisplayMode.CIRCLE
            else -> DisplayMode.HIDDEN
        }
    }

    /**
     * أحجام أقرب لحجم أيقونات خرائط جوجل.
     * LARGE ≈ 48-52dp على الشاشات الشائعة.
     */
    fun sizeForMode(mode: DisplayMode): Int {
        return when (mode) {
            DisplayMode.BUBBLE_LARGE -> 96   // كان 67 — أكبر بكثير ليطابق جوجل
            DisplayMode.BUBBLE_MEDIUM -> 56  // كان 34
            DisplayMode.CIRCLE -> 20
            DisplayMode.HIDDEN -> 0
        }
    }"""
          new_mode = """    fun displayModeForZoom(zoom: Int, latitude: Double = 30.0): DisplayMode {
        return when {
            zoom >= 16 -> DisplayMode.BUBBLE_LARGE
            zoom >= 14 -> DisplayMode.BUBBLE_MEDIUM
            zoom >= 12 -> DisplayMode.CIRCLE
            else -> DisplayMode.HIDDEN
        }
    }

    fun sizeForZoom(zoom: Int): Int {
        return when {
            zoom >= 18 -> 88
            zoom >= 17 -> 80
            zoom >= 16 -> 72
            zoom >= 15 -> 64
            zoom >= 14 -> 56
            zoom >= 13 -> 44
            zoom >= 12 -> 32
            zoom >= 11 -> 22
            else -> 0
        }
    }

    fun sizeForMode(mode: DisplayMode): Int {
        return when (mode) {
            DisplayMode.BUBBLE_LARGE -> 80
            DisplayMode.BUBBLE_MEDIUM -> 56
            DisplayMode.CIRCLE -> 28
            DisplayMode.HIDDEN -> 0
        }
    }"""
          assert old_mode in c2, 'mode block not found'
          c2 = c2.replace(old_mode, new_mode, 1)
          p2.write_text(c2, encoding='utf-8')
          print('MarkerIconHelper OK')

          p3 = Path('app/src/main/java/com/marketmaps/app/ui/map/StoreDetailsDialog.kt')
          c3 = p3.read_text(encoding='utf-8')
          c3 = c3.replace(
              'spring(dampingRatio = Spring.DampingRatioNoBouncy, stiffness = Spring.StiffnessMedium)',
              'spring(dampingRatio = Spring.DampingRatioNoBouncy, stiffness = 700f)',
              1
          )
          p3.write_text(c3, encoding='utf-8')
          print('StoreDetails OK')
          print('ALL DONE')
          PY

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/marketmaps/app/ui/map/*.kt
          git diff --staged --stat
          git commit -m "fix: مزامنة البطاقة والزر، تقليل وميض الموقع، تسريع التمييز، تنعيم الزوم" || true
          git push
