name: Fix Nav Bottom Pad

on:
  push:
    paths:
      - '.github/workflows/fix-nav-bottom-pad.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply navBottomPad fix
        run: |
          python3 -c "
          from pathlib import Path
          p = Path('app/src/main/java/com/marketmaps/app/ui/map/MapScreen.kt')
          c = p.read_text(encoding='utf-8')
          old = 'val navBottomPad = (if (detailsCardVisible) cardLift + 8.dp else 100.dp).coerceAtLeast(0.dp)'
          new = 'val navBottomPad = (if (detailsCardVisible) cardLift + 8.dp else 16.dp).coerceAtLeast(0.dp)'
          if old not in c:
              if new in c:
                  print('Already applied')
              else:
                  raise SystemExit('marker not found')
          else:
              c = c.replace(old, new, 1)
              p.write_text(c, encoding='utf-8')
              print('Applied OK')
          # تأكيد أن padding left موجود
          if 'padding(left = 12.dp, bottom = navBottomPad)' not in c:
              c2 = p.read_text(encoding='utf-8')
              c2 = c2.replace(
                  '.align(AbsoluteAlignment.BottomLeft)\n                        .padding(start = 12.dp, bottom = navBottomPad)',
                  '.align(AbsoluteAlignment.BottomLeft)\n                        .padding(left = 12.dp, bottom = navBottomPad)',
                  1
              )
              p.write_text(c2, encoding='utf-8')
              print('Also applied left padding')
          "

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/marketmaps/app/ui/map/MapScreen.kt
          git diff --staged --stat
          git commit -m "fix: خفض مسافة أسهم التنقل من الأسفل عند عدم ظهور بطاقة التفاصيل (100dp → 16dp)" || true
          git push
