name: Build Debug APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Ensure Gradle Wrapper JAR
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Downloading gradle-wrapper.jar..."
            mkdir -p gradle/wrapper
            curl -sL -o gradle/wrapper/gradle-wrapper.jar \
              https://github.com/gradle/gradle/raw/v8.11.1/gradle/wrapper/gradle-wrapper.jar
          fi
          ls -la gradle/wrapper/

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # إعادة محاولة تلقائية عند فشل الشبكة (مثل 429 من Maven)
      - name: Build Debug APK (arm64-v8a only)
        run: |
          set +e
          for i in 1 2 3; do
            echo "=== محاولة البناء رقم $i ==="
            ./gradlew assembleDebug --stacktrace --no-daemon
            EXIT=$?
            if [ $EXIT -eq 0 ]; then
              exit 0
            fi
            echo "فشل البناء (رمز $EXIT). انتظار قبل إعادة المحاولة..."
            sleep $((i * 45))
          done
          exit 1

      - name: List APK outputs
        if: success()
        run: find app/build/outputs -name "*.apk" -ls

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: MarketMaps-debug-arm64
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: error
