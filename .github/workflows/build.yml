name: Build Debug APK

# يعمل فقط عند التشغيل اليدوي من تبويب Actions
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      # الأيقونات الأصلية ~1.2MB لكل دقة — نضغطها للأبعاد الصحيحة قبل البناء
      - name: Optimize launcher icons
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          declare -A SIZES=([mdpi]=48 [hdpi]=72 [xhdpi]=96 [xxhdpi]=144 [xxxhdpi]=192)
          for dens in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            dir="app/src/main/res/mipmap-${dens}"
            size="${SIZES[$dens]}"
            mkdir -p "$dir"
            for name in ic_launcher ic_launcher_round; do
              src=""
              for cand in \
                "$dir/${name}.png" \
                "app/src/main/res/mipmap-xxxhdpi/${name}.png" \
                "app/src/main/res/mipmap-xxhdpi/${name}.png"; do
                if [ -f "$cand" ]; then src="$cand"; break; fi
              done
              if [ -n "$src" ]; then
                echo "Optimizing $name ($dens) -> ${size}x${size} from $src"
                convert "$src" -resize "${size}x${size}" -strip "PNG32:${dir}/${name}.png"
                ls -lh "${dir}/${name}.png"
              fi
            done
          done

      - name: Ensure Gradle Wrapper JAR
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Downloading gradle-wrapper.jar..."
            mkdir -p gradle/wrapper
            curl -sL -o gradle/wrapper/gradle-wrapper.jar \
              https://github.com/gradle/gradle/raw/v8.11.1/gradle/wrapper/gradle-wrapper.jar
          fi
          ls -la gradle/wrapper/

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK (arm64-v8a only)
        run: |
          set +e
          for i in 1 2 3; do
            echo "=== محاولة البناء رقم $i ==="
            ./gradlew assembleDebug --stacktrace --no-daemon
            EXIT=$?
            if [ $EXIT -eq 0 ]; then
              exit 0
            fi
            echo "فشل البناء (رمز $EXIT). انتظار قبل إعادة المحاولة..."
            sleep $((i * 45))
          done
          exit 1

      - name: List APK outputs
        if: success()
        run: find app/build/outputs -name "*.apk" -ls

      - name: Compress APK with 7-Zip (maximum)
        if: success()
        run: |
          sudo apt-get install -y -qq p7zip-full
          APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          echo "APK: $APK"
          ls -lh "$APK"
          7z a -t7z -m0=lzma2 -mx=9 -mfb=64 -md=32m -ms=on \
            MarketMaps-debug-arm64.7z "$APK"
          echo "=== بعد الضغط ==="
          ls -lh MarketMaps-debug-arm64.7z "$APK"

      - name: Upload compressed APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: MarketMaps-debug-arm64
          path: MarketMaps-debug-arm64.7z
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
