name: Build Debug APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Restore MapScreen.kt (from last good commit + icon fix)
        run: |
          TARGET="app/src/main/java/com/marketmaps/app/ui/map/MapScreen.kt"
          curl -sL "https://raw.githubusercontent.com/my-live-is-a-lie/Market-Maps/28160e6a05d7053cbbba9ac39cd49ef8c20cff7f/app/src/main/java/com/marketmaps/app/ui/map/MapScreen.kt" \
            -o "$TARGET"
          # استبدال أيقونات غير موجودة في material-icons-core
          sed -i 's/MyLocation/LocationOn/g' "$TARGET"
          echo "MapScreen lines: $(wc -l < "$TARGET")"
          grep -n LocationOn "$TARGET" | head -5

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Ensure Gradle Wrapper JAR
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            mkdir -p gradle/wrapper
            curl -sL -o gradle/wrapper/gradle-wrapper.jar \
              https://github.com/gradle/gradle/raw/v8.11.1/gradle/wrapper/gradle-wrapper.jar
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK (arm64-v8a only)
        run: ./gradlew assembleDebug --stacktrace --no-daemon --build-cache

      - name: Compress APK (fast)
        if: success()
        run: |
          APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          echo "APK: $APK"
          ls -lh "$APK"
          zip -9 MarketMaps-debug-arm64.zip "$APK"
          ls -lh MarketMaps-debug-arm64.zip "$APK"

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MarketMaps-debug-arm64
          path: MarketMaps-debug-arm64.zip
          if-no-files-found: error
          retention-days: 14
