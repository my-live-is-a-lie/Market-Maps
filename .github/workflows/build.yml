name: Build Debug APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Ensure Gradle Wrapper JAR
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            mkdir -p gradle/wrapper
            curl -sL -o gradle/wrapper/gradle-wrapper.jar \
              https://github.com/gradle/gradle/raw/v8.11.1/gradle/wrapper/gradle-wrapper.jar
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Inject Google Maps API key
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          if [ -z "$MAPS_API_KEY" ]; then
            echo "تحذير: لم يتم العثور على Secret باسم MAPS_API_KEY — خرائط جوجل لن تعمل"
            echo "MAPS_API_KEY=" >> local.properties
          else
            echo "MAPS_API_KEY=***"
            echo "MAPS_API_KEY=$MAPS_API_KEY" >> local.properties
          fi

      - name: Build Debug APK (arm64-v8a only)
        run: ./gradlew assembleDebug --stacktrace --no-daemon --build-cache

      - name: Prepare APK for upload
        if: success()
        run: |
          APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          echo "APK: $APK"
          ls -lh "$APK"
          # نرفع ملف APK مباشرة — GitHub يضغطه مرة واحدة فقط عند التحميل
          cp "$APK" ./MarketMaps-debug-arm64.apk
          ls -lh ./MarketMaps-debug-arm64.apk

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MarketMaps-debug-arm64
          path: MarketMaps-debug-arm64.apk
          if-no-files-found: error
          retention-days: 14
