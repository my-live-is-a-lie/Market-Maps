name: Patch Zoom Thresholds

on:
  push:
    paths:
      - 'scripts/patch_zoom_thresholds.py'
      - '.github/workflows/patch-zoom-thresholds.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/patch_zoom_thresholds.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/marketmaps/app/ui/map/MarkerIconHelper.kt
          git diff --staged --stat
          git commit -m "UI: دوائر عند 200م/500قدم فقط — إخفاء الأيقونات عند التصغير أكثر" || true
          git push
