name: Fix Absolute Padding

on:
  push:
    paths:
      - '.github/workflows/fix-absolute-padding.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Replace padding(left) with absolutePadding
        run: |
          python3 -c "
          from pathlib import Path
          p = Path('app/src/main/java/com/marketmaps/app/ui/map/MapScreen.kt')
          c = p.read_text(encoding='utf-8')
          old = '.padding(left = 12.dp, bottom = navBottomPad)'
          new = '.absolutePadding(left = 12.dp, bottom = navBottomPad)'
          if old not in c:
              if new in c:
                  print('Already fixed')
              else:
                  raise SystemExit('marker not found: ' + repr(c[c.find('navBottomPad')-80:c.find('navBottomPad')+80] if 'navBottomPad' in c else 'no navBottomPad'))
          else:
              c = c.replace(old, new, 1)
              p.write_text(c, encoding='utf-8')
              print('Fixed OK')
          "

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/marketmaps/app/ui/map/MapScreen.kt
          git diff --staged --stat
          git commit -m "fix: استخدام absolutePadding بدل padding(left) لأسهم التنقل" || true
          git push
