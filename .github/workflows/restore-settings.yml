name: Restore SettingsScreen

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/restore-settings.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download good SettingsScreen
        run: |
          curl -sL "https://raw.githubusercontent.com/my-live-is-a-lie/Market-Maps/10b06ca07c78b198d1939520ab204cde1affb577/app/src/main/java/com/marketmaps/app/ui/settings/SettingsScreen.kt" \
            -o app/src/main/java/com/marketmaps/app/ui/settings/SettingsScreen.kt
          wc -l app/src/main/java/com/marketmaps/app/ui/settings/SettingsScreen.kt

      - name: Insert ThemedIconSettingsSection call
        run: |
          python3 -c "
          from pathlib import Path
          p = Path('app/src/main/java/com/marketmaps/app/ui/settings/SettingsScreen.kt')
          c = p.read_text(encoding='utf-8')
          old = '''                            Text(\"تطبيق اللون المخصص\")\n                        }\n                    }\n                }\n            }\n        }\n    }\n}\n'''
          new = '''                            Text(\"تطبيق اللون المخصص\")\n                        }\n                    }\n                }\n            }\n\n            ThemedIconSettingsSection()\n        }\n    }\n}\n'''
          if old not in c:
              raise SystemExit('marker not found')
          c = c.replace(old, new, 1)
          c = c.replace('subtitle = \"النمط الفاتح/الغامق ولون التمييز\"', 'subtitle = \"النمط ولون التمييز وأيقونة النظام\"')
          p.write_text(c, encoding='utf-8')
          print('ok', len(c))
          "

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/marketmaps/app/ui/settings/SettingsScreen.kt
          git diff --staged --stat
          git commit -m "fix: استعادة SettingsScreen + قسم أيقونة النظام المتكيفة" || true
          git push
