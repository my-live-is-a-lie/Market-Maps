name: Restore SettingsScreen

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/restore-settings.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore SettingsScreen from good commit and patch
        run: |
          set -e
          curl -sL "https://raw.githubusercontent.com/my-live-is-a-lie/Market-Maps/10b06ca07c78b198d1939520ab204cde1affb577/app/src/main/java/com/marketmaps/app/ui/settings/SettingsScreen.kt" \
            -o app/src/main/java/com/marketmaps/app/ui/settings/SettingsScreen.kt

          python3 << 'PY'
          from pathlib import Path
          path = Path("app/src/main/java/com/marketmaps/app/ui/settings/SettingsScreen.kt")
          c = path.read_text(encoding="utf-8")

          marker = '''                        ) {
                            Text("تطبيق اللون المخصص")
                        }
                    }
                }
            }
        }
    }
}
'''

          insert = '''                        ) {
                            Text("تطبيق اللون المخصص")
                        }
                    }
                }
            }

            ThemedIconSettingsSection()
        }
    }
}
'''

          if marker not in c:
              raise SystemExit("MARKER NOT FOUND - abort")

          c = c.replace(marker, insert, 1)
          c = c.replace(
              'subtitle = "النمط الفاتح/الغامق ولون التمييز"',
              'subtitle = "النمط ولون التمييز وأيقونة النظام"'
          )
          path.write_text(c, encoding="utf-8")
          print("Patched OK, length", len(c))
          PY

          test -f app/src/main/java/com/marketmaps/app/ui/settings/ThemedIconSettingsSection.kt

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/marketmaps/app/ui/settings/SettingsScreen.kt
          git status
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "fix: استعادة SettingsScreen + قسم أيقونة النظام المتكيفة"
            git push
          fi
