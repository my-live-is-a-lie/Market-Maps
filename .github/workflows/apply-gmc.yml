name: Apply GMC
on:
  push:
    paths:
      - 'scripts/apply_gmc.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/apply_gmc.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/marketmaps/app/ui/map/GoogleMapContent.kt
          git commit -m "fix: استعادة GoogleMapContent بمبدأ تكبير النسخة القديمة" || true
          git push
