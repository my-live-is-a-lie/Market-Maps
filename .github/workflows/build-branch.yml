name: Build Debug APK (branch)

# سير عمل مؤقت: نفس خطوات Build Debug APK لكن يعمل تلقائياً على فرع المراجعة
on:
  push:
    branches:
      - arena/01a0e716-market-maps

concurrency:
  group: build-branch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Inject Google Maps API key
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          if [ -z "$MAPS_API_KEY" ]; then
            echo "تحذير: لم يتم العثور على Secret باسم MAPS_API_KEY — خرائط جوجل لن تعمل"
            echo "MAPS_API_KEY=" >> local.properties
          else
            echo "MAPS_API_KEY=$MAPS_API_KEY" >> local.properties
            echo "تم حقن مفتاح API (الطول: ${#MAPS_API_KEY})"
          fi
          if [ -f app/debug.keystore ]; then
            echo "===== SHA-1 Debug (أضفه في Google Cloud Console) ====="
            keytool -list -v -keystore app/debug.keystore -storepass android -alias androiddebugkey 2>/dev/null | grep -E "SHA1:|SHA256:" || true
            echo "======================================================"
          fi

      - name: توليد أيقونات SVG (تشخيص صريح)
        if: always()
        run: |
          ./gradlew generateLauncherIcons --no-build-cache --no-configuration-cache --stacktrace 2>&1 | tee gen.log || true
          echo "==== أسطر التشخيص ===="
          grep -hE "MARKETMAPS_|تخطّي|أيقونات الشعارات" gen.log | head -15 || true
          grep -hE "MARKETMAPS_|تخطّي|أيقونات الشعارات" gen.log | head -12 | while IFS= read -r l; do
            l="${l//'%'/'%25'}"; l="${l//$'\r'/''}"
            echo "::warning title=GEN::$l"
          done
          echo "==== ملفات المولّدة بعد التشغيل ===="
          find app/build/generated/launcherIcons -type f 2>/dev/null | sort | head -25 | while IFS= read -r f; do
            echo "::warning title=GENFILE::$f"
          done

      - name: Build Debug APK (arm64-v8a only)
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace --no-daemon --build-cache 2>&1 | tee build.log

      - name: Report compile errors
        if: failure()
        run: |
          ERRS=$(grep -E "^e: |What went wrong" -A2 build.log | grep -vE "^\s+at " | head -60 || true)
          [ -z "$ERRS" ] && ERRS=$(tail -40 build.log)
          ERRS="${ERRS//'%'/'%25'}"; ERRS="${ERRS//$'\n'/'%0A'}"
          echo "::error title=Build failed::$ERRS"
          # تفاصيل مشاكل ذاكرة الإعدادات وغيرها (كل سطر كملاحظة مستقلة)
          grep -n -A25 "Configuration cache problems" build.log 2>/dev/null | head -30 | while IFS= read -r l; do
            l="${l//'%'/'%25'}"
            echo "::error title=CC::$l"
          done || true

      - name: عرض أيقونات SVG المولّدة
        if: always()
        run: |
          echo "==== ملفات مولّدة من SVG ===="
          find app/build/generated/launcherIcons -type f 2>/dev/null | sort | head -40 || true
          find app/build/generated/launcherIcons -type f 2>/dev/null | sort | head -25 | while IFS= read -r f; do
            echo "::warning title=GEN::$f"
          done
          CNT=$(find app/build/generated/launcherIcons -type f 2>/dev/null | wc -l)
          echo "::warning title=MARKETMAPS_COUNT::$CNT ملف مولّد"
          JSON=$(cat app/build/generated/launcherIcons/assets/launcher_icons.json 2>/dev/null | tr -d '\n' | head -c 800)
          echo "::warning title=MARKETMAPS_JSON::${JSON:-لا يوجد فهرس}"
          grep -h "MARKETMAPS_" build.log 2>/dev/null | head -12 | while IFS= read -r l; do
            l="${l//'%'/'%25'}"; l="${l//$'\r'/''}"
            echo "::warning title=DIAG::$l"
          done || true

      - name: Prepare APK for upload
        if: success()
        run: |
          cp "$(find app/build/outputs/apk/debug -name '*.apk' | head -1)" ./MarketMaps-debug-arm64.apk
          ls -lh ./MarketMaps-debug-arm64.apk

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MarketMaps-debug-arm64-branch
          path: MarketMaps-debug-arm64.apk
          if-no-files-found: error
          retention-days: 14
