name: Build Debug APK (branch)

# سير عمل مؤقت: نفس خطوات Build Debug APK لكن يعمل تلقائياً على فرع المراجعة
on:
  push:
    branches:
      - arena/01a0e716-market-maps

concurrency:
  group: build-branch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Inject Google Maps API key
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          if [ -z "$MAPS_API_KEY" ]; then
            echo "تحذير: لم يتم العثور على Secret باسم MAPS_API_KEY — خرائط جوجل لن تعمل"
            echo "MAPS_API_KEY=" >> local.properties
          else
            echo "MAPS_API_KEY=$MAPS_API_KEY" >> local.properties
            echo "تم حقن مفتاح API (الطول: ${#MAPS_API_KEY})"
          fi
          if [ -f app/debug.keystore ]; then
            echo "===== SHA-1 Debug (أضفه في Google Cloud Console) ====="
            keytool -list -v -keystore app/debug.keystore -storepass android -alias androiddebugkey 2>/dev/null | grep -E "SHA1:|SHA256:" || true
            echo "======================================================"
          fi

      - name: Build Debug APK (arm64-v8a only)
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace --no-daemon --build-cache 2>&1 | tee build.log

      - name: Report compile errors
        if: failure()
        run: |
          ERRS=$(grep -E "^e: |What went wrong" -A2 build.log | grep -vE "^\s+at " | head -60 || true)
          [ -z "$ERRS" ] && ERRS=$(tail -40 build.log)
          ERRS="${ERRS//'%'/'%25'}"; ERRS="${ERRS//$'\n'/'%0A'}"
          echo "::error title=Build failed::$ERRS"

      - name: "تحقق نهائي: تمييز المعالم في الوضع الليلي + عدم التراجع"
        if: always()
        run: |
          SRC=app/src/main/java/com/marketmaps/app/ui/map
          echo "=== 1) اللوحة الليلية: هل تُميَّز المياه والخضرة والعمران؟ ==="
          python3 - <<'PYEOF' || true
          import json, colorsys
          d = json.load(open('app/src/main/res/raw/map_style_night.json', encoding='utf-8'))
          def color(feature, elem):
              for r in d:
                  if r.get('featureType') == feature and r.get('elementType') == elem:
                      for s in r.get('stylers', []):
                          if 'color' in s: return s['color']
              return None
          def hsv(c):
              r, g, b = (int(c[i:i+2], 16) / 255 for i in (1, 3, 5))
              return colorsys.rgb_to_hsv(r, g, b)
          land = '#242f3e'
          water = color('water', 'geometry')
          park = color('poi.park', 'geometry')
          natural = color('landscape.natural', 'geometry')
          man = color('landscape.man_made', 'geometry')
          road = color('road', 'geometry')
          if water and park and natural and man:
              hw, sw, vw = hsv(water); hp, sp, vp = hsv(park); hl, sl, vl = hsv(land)
              blue = 190 <= hw * 360 <= 240 and sw >= 0.60
              green = 100 <= hp * 360 <= 175 and sp >= 0.30
              msg = (f"قواعد={len(d)} مياه={water}(صفاء={sw*100:.0f}%) خضرة={park}/{natural} "
                     f"عمران={man} طرق={road} أطوار=أرض{hl*360:.0f}°/خضرة{hp*360:.0f}°/مياه{hw*360:.0f}° "
                     f"تمييز={'نعم' if (blue and green) else 'لا'}")
          else:
              msg = "مفقود: قواعد المياه/الخضرة/العمران في النمط الليلي"
          print(msg)
          print(f"::error title=NIGHT_PALETTE::{msg}")
          PYEOF
          echo "=== 2) لا فلتر عرض (كان يُسوّد رموز الشعارات) ==="
          OLD=$(grep -rl "applyNightFilter\|setLayerType" $SRC | wc -l)
          echo "::error title=NO_VIEW_FILTER::ملفات_بفلتر_العرض=$OLD (المطلوب 0)"
          echo "=== 3) تلوين بلاطات الأونلاين على مستوى الكاش ==="
          grep -c "NightTileCache" $SRC/MapLayerHelper.kt
          echo "=== 4) أحجام العلامات (كانت 57/34/11) ==="
          grep -nE "BUBBLE_LARGE_PX = |BUBBLE_MEDIUM_PX = |CIRCLE_PX = " $SRC/MarkerIconHelper.kt
          echo "=== 5) أسماء الأماكن أسفل أيقونات OSM ==="
          grep -n "getMarkerBitmapWithLabel" $SRC/MapScreen.kt | head -2
          echo "=== 6) داخل APK ==="
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          MATCH=$(unzip -l "$APK" | grep -E "assets/mapsforge/dark\.xml|map_style_night" || true)
          echo "$MATCH"
          echo "::error title=NIGHT_APK::$(echo "$MATCH" | tr '\n' '|')"
          echo "=== 7) لا تراجع: الشعارات ==="
          LOGOS=$(find app/build/generated/launcherIcons/res/drawable -name "logo_*_foreground.xml" | sed 's|.*/||' | tr '\n' ' ')
          IC=$(find app/build/generated/launcherIcons/res/mipmap-anydpi-v26 -name "*.xml" | wc -l)
          MERGED=$(find app/build/intermediates -name "AndroidManifest.xml" -path "*merged_manifest*" | head -1)
          AL=$(grep -c "<activity-alias" "$MERGED" || echo 0)
          echo "::error title=FINAL::شعارات=[$LOGOS] أيقونات=$IC aliases=$AL"

      - name: Prepare APK for upload
        if: success()
        run: |
          cp "$(find app/build/outputs/apk/debug -name '*.apk' | head -1)" ./MarketMaps-debug-arm64.apk
          ls -lh ./MarketMaps-debug-arm64.apk

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MarketMaps-debug-arm64-branch
          path: MarketMaps-debug-arm64.apk
          if-no-files-found: error
          retention-days: 14
