name: Build Debug APK (branch)

on:
  push:
    branches:
      - arena/01a0e716-market-maps

concurrency:
  group: build-branch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Inject Google Maps API key
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          if [ -z "$MAPS_API_KEY" ]; then
            echo "MAPS_API_KEY=" >> local.properties
          else
            echo "MAPS_API_KEY=$MAPS_API_KEY" >> local.properties
          fi

      - name: Build Debug APK (arm64-v8a only)
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace --no-daemon --build-cache 2>&1 | tee build.log

      - name: Report compile errors
        if: failure()
        run: |
          ERRS=$(grep -E "^e: |What went wrong" -A2 build.log | grep -vE "^\s+at " | head -60 || true)
          [ -z "$ERRS" ] && ERRS=$(tail -40 build.log)
          ERRS="${ERRS//'%'/'%25'}"; ERRS="${ERRS//$'\n'/'%0A'}"
          echo "::error title=Build failed::$ERRS"

      - name: "تحقق نهائي: ألوان الفاتح للأنهار والخضرة + ليلي لما عداها"
        if: always()
        run: |
          echo "=== 1) اللوحة: ما هو ليلي وما هو مأخوذ من الخريطة الفاتحة ==="
          python3 - <<'PYEOF' || true
          import json, colorsys, re, sys
          d = json.load(open('app/src/main/res/raw/map_style_night.json', encoding='utf-8'))
          def rule(ft, et='geometry'):
              for r in d:
                  if r.get('featureType') == ft and r.get('elementType') == et:
                      for st in r.get('stylers', []):
                          if 'color' in st: return st['color']
              return None
          def general(et):
              for r in d:
                  if 'featureType' not in r and r.get('elementType') == et:
                      for st in r.get('stylers', []):
                          if 'color' in st: return st['color']
              return None
          def hsv(c):
              r, g, b = (int(c[i:i+2], 16) / 255 for i in (1, 3, 5))
              h, s, v = colorsys.rgb_to_hsv(r, g, b)
              return h * 360, s, v
          features = {r.get('featureType', '(عام)') for r in d}
          veg = rule('landscape.natural.landcover')
          land = rule('landscape.natural'); man = rule('landscape.man_made')
          road = rule('road'); label = general('labels.text.fill')
          vh, vs, vv = hsv(veg); lh, ls, lv = hsv(land); rh, rs, rv = hsv(road); lh2, ls2, lv2 = hsv(label)
          checks = {
           'المياه_غير_مذكورة': 'water' not in features,
           'الحدائق_غير_مذكورة': 'poi.park' not in features,
           'الغطاء_النباتي_فاتح': 90 <= vh <= 130 and vv >= 0.80,
           'الأرض_داكنة': lv <= 0.30,
           'المباني_داكنة': hsv(man)[2] <= 0.30,
           'الشوارع_داكنة_وأفتح_من_الأرض': rv <= 0.55 and rv > lv,
           'التسميات_بيضاء': lv2 >= 0.90,
          }
          failed = [k for k, v in checks.items() if not v]
          print(f"نموذج جوجل: قواعد={len(d)} خضرة={veg}({vh:.0f}°,إضاءة{vv*100:.0f}%) أرض={land} مباني={man} شوارع={road} تسميات={label} فاشل={failed or 'لا شيء'}")

          s = open('app/src/main/assets/mapsforge/dark.xml', encoding='utf-8').read()
          need = {'أخضر_فاتح': '#BFE0B4', 'حدائق_فاتحة': '#C6E5BE', 'مياه_فاتحة': '#A2CBE6', 'أرض_ليلية': '#1B2531', 'شوارع_ليلية': '#3F5261'}
          missing = [k for k, v in need.items() if v.upper() not in s.upper()]
          print(f"ثيم OSM الأوفلاين: مفقود={missing or 'لا شيء'}")

          code = open('app/src/main/java/com/marketmaps/app/ui/map/NightTileCache.kt', encoding='utf-8').read()
          nums = [int(x) for x in re.findall(r'-?\d+', re.search(r'CONTROL = intArrayOf\((.*?)\)', code, re.S).group(1))]
          ctrl = [(nums[i], nums[i + 1]) for i in range(0, len(nums), 2)]
          lut = []
          for i in range(256):
              q = 0
              while q < len(ctrl) - 2 and ctrl[q + 1][0] < i: q += 1
              x0, y0 = ctrl[q]; x1, y1 = ctrl[q + 1]
              lut.append(y1 if x1 <= x0 else y0 + (y1 - y0) * (i - x0) // (x1 - x0))
          sp = int(re.search(r'LOW_CHROMA_SPREAD = (\d+)', code).group(1))
          bb = int(re.search(r'BLUE_BIAS = (\d+)', code).group(1))
          gb = int(re.search(r'GREEN_BIAS = (\d+)', code).group(1))
          cr = int(re.search(r'COOL_R = (-?\d+)', code).group(1))
          cb = int(re.search(r'COOL_B = (\d+)', code).group(1))
          def apply(hx):
              r, g, b = (int(hx[i:i+2], 16) for i in (1, 3, 5))
              y = (r * 77 + g * 150 + b * 29) >> 8
              if max(r, g, b) - min(r, g, b) < sp:
                  t = lut[max(0, min(255, y))]
                  return (max(0, min(255, t + cr)), t, max(0, min(255, t + cb)))
              f = max(0.75, min(1.3, y / 190))
              if b - r > bb: return (int(162 * f), int(203 * f), int(230 * f))
              if g - r > gb: return (int(191 * f), int(224 * f), int(180 * f))
              w = max(0.85, min(1.1, y / 200)); return (int(85 * w), int(108 * w), int(122 * w))
          def lum(t): return 0.2126 * t[0] + 0.7152 * t[1] + 0.0722 * t[2]
          water = apply('#AAD3DF'); green = apply('#ADD19E'); land2 = apply('#F2EFE9')
          wh, ws, wv = hsv('#%02X%02X%02X' % water); gh, gs, gv = hsv('#%02X%02X%02X' % green)
          tiles_ok = wv >= 0.70 and gv >= 0.70 and lum(land2) <= 45 and 190 <= wh <= 225 and 90 <= gh <= 130
          print(f"بلاطات OSM: مياه=#{water[0]:02X}{water[1]:02X}{water[2]:02X}(إضاءة{lum(water):.0f}) خضرة=#{green[0]:02X}{green[1]:02X}{green[2]:02X}(إضاءة{lum(green):.0f}) أرض=#{land2[0]:02X}{land2[1]:02X}{land2[2]:02X}(إضاءة{lum(land2):.0f}) مطابق={'نعم' if tiles_ok else 'لا'}")
          for t, m in (('GOOGLE_PALETTE', f"قواعد={len(d)} خضرة={veg} أرض={land} مباني={man} شوارع={road} تسميات={label} فاشل={failed or 'لا شيء'}"),
                           ('OSM_TILES', f"مياه=#{water[0]:02X}{water[1]:02X}{water[2]:02X} خضرة=#{green[0]:02X}{green[1]:02X}{green[2]:02X} أرض=#{land2[0]:02X}{land2[1]:02X}{land2[2]:02X} مطابق={'نعم' if tiles_ok else 'لا'}"),
                           ('OFFLINE_THEME', f"مفقود={missing or 'لا شيء'} ألوان_الفاتح=نعم")):
              print(f"::error title={t}::{m}")
          sys.exit(0 if (not failed and not missing and tiles_ok) else 1)

          PYEOF
          echo "=== 2) داخل APK + الشعارات ==="
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          MATCH=$(unzip -l "$APK" | grep -E "assets/mapsforge/dark\.xml|map_style_night" || true)
          echo "$MATCH"; echo "::error title=NIGHT_APK::$(echo "$MATCH" | tr '\n' '|')"
          LOGOS=$(find app/build/generated/launcherIcons/res/drawable -name "logo_*_foreground.xml" | sed 's|.*/||' | tr '\n' ' ')
          IC=$(find app/build/generated/launcherIcons/res/mipmap-anydpi-v26 -name "*.xml" | wc -l)
          MERGED=$(find app/build/intermediates -name "AndroidManifest.xml" -path "*merged_manifest*" | head -1)
          AL=$(grep -c "<activity-alias" "$MERGED" || echo 0)
          echo "::error title=FINAL::شعارات=[$LOGOS] أيقونات=$IC aliases=$AL"

      - name: Prepare APK for upload
        if: success()
        run: |
          cp "$(find app/build/outputs/apk/debug -name '*.apk' | head -1)" ./MarketMaps-debug-arm64.apk
          ls -lh ./MarketMaps-debug-arm64.apk

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MarketMaps-debug-arm64-branch
          path: MarketMaps-debug-arm64.apk
          if-no-files-found: error
          retention-days: 14
