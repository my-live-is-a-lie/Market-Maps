name: Build Debug APK (branch)

# سير عمل مؤقت: نفس خطوات Build Debug APK لكن يعمل تلقائياً على فرع المراجعة
on:
  push:
    branches:
      - arena/01a0e716-market-maps

concurrency:
  group: build-branch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Inject Google Maps API key
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          if [ -z "$MAPS_API_KEY" ]; then
            echo "تحذير: لم يتم العثور على Secret باسم MAPS_API_KEY — خرائط جوجل لن تعمل"
            echo "MAPS_API_KEY=" >> local.properties
          else
            echo "MAPS_API_KEY=$MAPS_API_KEY" >> local.properties
            echo "تم حقن مفتاح API (الطول: ${#MAPS_API_KEY})"
          fi
          if [ -f app/debug.keystore ]; then
            echo "===== SHA-1 Debug (أضفه في Google Cloud Console) ====="
            keytool -list -v -keystore app/debug.keystore -storepass android -alias androiddebugkey 2>/dev/null | grep -E "SHA1:|SHA256:" || true
            echo "======================================================"
          fi

      - name: Build Debug APK (arm64-v8a only)
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace --no-daemon --build-cache 2>&1 | tee build.log

      - name: Report compile errors
        if: failure()
        run: |
          ERRS=$(grep -E "^e: |What went wrong" -A2 build.log | grep -vE "^\s+at " | head -60 || true)
          [ -z "$ERRS" ] && ERRS=$(tail -40 build.log)
          ERRS="${ERRS//'%'/'%25'}"; ERRS="${ERRS//$'\n'/'%0A'}"
          echo "::error title=Build failed::$ERRS"

      - name: "تحقق من الشعارات الأربعة والأيقونات"
        if: always()
        run: |
          LOGOS=$(find app/build/generated/launcherIcons/res/drawable -name "logo_*_foreground.xml" 2>/dev/null | sed 's|.*/||' | sort | tr '\n' ' ')
          IC=$(find app/build/generated/launcherIcons/res/mipmap-anydpi-v26 -name "*.xml" 2>/dev/null | wc -l)
          SKIP=$(grep -ho "MARKETMAPS_SKIP=[^ ]*" build.log gen.log 2>/dev/null | head -4 | tr '\n' ' ')
          MERGED=$(find app/build/intermediates -name "AndroidManifest.xml" -path "*merged_manifest*" 2>/dev/null | head -1)
          AL=$(grep -c "<activity-alias" "$MERGED" 2>/dev/null || echo 0)
          EN=$(grep -A7 "<activity-alias" "$MERGED" 2>/dev/null | grep -c 'android:enabled="true"' || echo 0)
          JSON=$(cat app/build/generated/launcherIcons/assets/launcher_icons.json 2>/dev/null | tr -d '\n' | head -c 400)
          echo "::error title=L1::شعارات=[$LOGOS] أيقونات=$IC"
          echo "::error title=L2::متخطّى=[${SKIP:-لا شيء}]"
          echo "::error title=L3::aliases=$AL مفعّلة=$EN"
          echo "::error title=L4::${JSON:-لا فهرس}"

      - name: Prepare APK for upload
        if: success()
        run: |
          cp "$(find app/build/outputs/apk/debug -name '*.apk' | head -1)" ./MarketMaps-debug-arm64.apk
          ls -lh ./MarketMaps-debug-arm64.apk

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MarketMaps-debug-arm64-branch
          path: MarketMaps-debug-arm64.apk
          if-no-files-found: error
          retention-days: 14
