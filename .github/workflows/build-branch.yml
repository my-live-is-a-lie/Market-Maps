name: Build Debug APK (branch)

# سير عمل مؤقت: نفس خطوات Build Debug APK لكن يعمل تلقائياً على فرع المراجعة
on:
  push:
    branches:
      - arena/01a0e716-market-maps

concurrency:
  group: build-branch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Inject Google Maps API key
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          if [ -z "$MAPS_API_KEY" ]; then
            echo "تحذير: لم يتم العثور على Secret باسم MAPS_API_KEY — خرائط جوجل لن تعمل"
            echo "MAPS_API_KEY=" >> local.properties
          else
            echo "MAPS_API_KEY=$MAPS_API_KEY" >> local.properties
            echo "تم حقن مفتاح API (الطول: ${#MAPS_API_KEY})"
          fi
          if [ -f app/debug.keystore ]; then
            echo "===== SHA-1 Debug (أضفه في Google Cloud Console) ====="
            keytool -list -v -keystore app/debug.keystore -storepass android -alias androiddebugkey 2>/dev/null | grep -E "SHA1:|SHA256:" || true
            echo "======================================================"
          fi

      - name: Build Debug APK (arm64-v8a only)
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace --no-daemon --build-cache 2>&1 | tee build.log

      - name: Report compile errors
        if: failure()
        run: |
          ERRS=$(grep -E "^e: |What went wrong" -A2 build.log | grep -vE "^\s+at " | head -60 || true)
          [ -z "$ERRS" ] && ERRS=$(tail -40 build.log)
          ERRS="${ERRS//'%'/'%25'}"; ERRS="${ERRS//$'\n'/'%0A'}"
          echo "::error title=Build failed::$ERRS"

      - name: "تحقق نهائي: تلوين بلاطات OSM + نمط جوجل + عدم التراجع"
        if: always()
        run: |
          SRC=app/src/main/java/com/marketmaps/app/ui/map
          echo "=== 1) جدول إضاءة بلاطات OSM: محاكاة ألوان Mapnik الحقيقية ==="
          python3 - <<'PYEOF' || true
          import re, colorsys
          code = open('app/src/main/java/com/marketmaps/app/ui/map/NightTileCache.kt', encoding='utf-8').read()
          m = re.search(r'CONTROL = intArrayOf\((.*?)\)', code, re.S)
          nums = [int(x) for x in re.findall(r'-?\d+', m.group(1))]
          ctrl = [(nums[i], nums[i + 1]) for i in range(0, len(nums), 2)]
          lut = []
          for i in range(256):
              p = 0
              while p < len(ctrl) - 2 and ctrl[p + 1][0] < i:
                  p += 1
              x0, y0 = ctrl[p]; x1, y1 = ctrl[p + 1]
              lut.append(y1 if x1 <= x0 else y0 + (y1 - y0) * (i - x0) // (x1 - x0))

          chroma = float(re.search(r'CHROMA = ([\d.]+)f', code).group(1))
          spread_max = int(re.search(r'LOW_CHROMA_SPREAD = (\d+)', code).group(1))
          cool_r = int(re.search(r'COOL_R = (\d+)', code).group(1))
          cool_b = int(re.search(r'COOL_B = (\d+)', code).group(1))

          def apply(hexcolor):
              r = int(hexcolor[1:3], 16); g = int(hexcolor[3:5], 16); b = int(hexcolor[5:7], 16)
              y = (r * 77 + g * 150 + b * 29) >> 8
              ny = lut[max(0, min(255, y))]
              if max(r, g, b) - min(r, g, b) < spread_max:
                  out = (ny + (r - y) - cool_r, ny + (g - y), ny + (b - y) + cool_b)
              else:
                  out = (ny + int((r - y) * chroma), ny + int((g - y) * chroma), ny + int((b - y) * chroma))
              return tuple(max(0, min(255, c)) for c in out)

          def hexof(t): return '#%02X%02X%02X' % t
          def lum(t): return 0.2126 * t[0] + 0.7152 * t[1] + 0.0722 * t[2]
          def hue(t):
              h, s, v = colorsys.rgb_to_hsv(t[0] / 255, t[1] / 255, t[2] / 255)
              return h * 360, s, v

          samples = {
              'أرض Mapnik #F2EFE9': '#F2EFE9',
              'شارع أبيض #FFFFFF': '#FFFFFF',
              'حدود الشارع #B5AFA5': '#B5AFA5',
              'نص داكن #333333': '#333333',
              'مياه #AAD3DF': '#AAD3DF',
              'غابة #ADD19E': '#ADD19E',
          }
          out = {k: apply(v) for k, v in samples.items()}
          for k, v in out.items():
              h, s, vv = hue(v)
              print(f"  {k:22s} → {hexof(v)} إضاءة={lum(v):5.1f} طور={h:5.1f}°")
          road = lum(out['شارع أبيض #FFFFFF']); land = lum(out['أرض Mapnik #F2EFE9'])
          casing = lum(out['حدود الشارع #B5AFA5']); text = lum(out['نص داكن #333333'])
          wh, ws, wv = hue(out['مياه #AAD3DF'])
          gh, gs, gv = hue(out['غابة #ADD19E'])
          ok = (road > land + 40) and (land < casing < road) and (text > 150) and (180 <= wh <= 240) and (90 <= gh <= 170)
          ws2 = hue(out['مياه #AAD3DF'])[1]
          gs2 = hue(out['غابة #ADD19E'])[1]
          ok = ok and ws2 >= 0.35 and gs2 >= 0.35
          msg = (f"جدول={len(lut)} شوارع={road:.0f} أرض={land:.0f} حدود={casing:.0f} نص={text:.0f} "
                 f"مياه={hexof(out['مياه #AAD3DF'])}({wh:.0f}°,صفاء{ws2*100:.0f}%) خضرة={hexof(out['غابة #ADD19E'])}({gh:.0f}°,صفاء{gs2*100:.0f}%) "
                 f"ترتيب_طبيعي={'نعم' if ok else 'لا'}")
          print(msg)
          print(f"::error title=OSM_LUT::{msg}")
          PYEOF
          echo "=== 2) نمط جوجل: لا طبقة خضراء مفاجئة + خضرة/مياه واضحة ==="
          python3 - <<'PYEOF' || true
          import json, colorsys
          d = json.load(open('app/src/main/res/raw/map_style_night.json', encoding='utf-8'))
          def color(feature, elem='geometry'):
              for r in d:
                  if r.get('featureType') == feature and r.get('elementType') == elem:
                      for s in r.get('stylers', []):
                          if 'color' in s: return s['color']
              return None
          def hsv(c):
              r, g, b = (int(c[i:i+2], 16) / 255 for i in (1, 3, 5))
              return colorsys.rgb_to_hsv(r, g, b)
          land = '#242f3e'
          nat = color('landscape.natural'); cover = color('landscape.natural.landcover')
          park = color('poi.park'); water = color('water')
          def dist(a, b):
              ha, sa, va = hsv(a); hb, sb, vb = hsv(b)
              return abs(ha - hb) * 360 + abs(sa - sb) * 100 + abs(va - vb) * 100
          gentle = nat and cover and dist(nat, land) < 12 and dist(cover, land) < 12
          _, ps, pv = hsv(park); _, ws, wv = hsv(water)
          ph, _, _ = hsv(park); wh, _, _ = hsv(water)
          msg = (f"قواعد={len(d)} طبيعي={nat}/{cover}(قريب_من_الأرض={'نعم' if gentle else 'لا'}) "
                 f"متنزهات={park}(طور{ph*360:.0f}° صفاء{ps*100:.0f}%) مياه={water}(طور{wh*360:.0f}° صفاء{ws*100:.0f}%)")
          print(msg)
          print(f"::error title=GOOGLE_PALETTE::{msg}")
          PYEOF
          echo "=== 3) لا فلتر عرض (كان يُسوّد رموز الشعارات) ==="
          OLD=$(grep -rl "applyNightFilter\|setLayerType" $SRC | wc -l)
          echo "::error title=NO_VIEW_FILTER::ملفات_بفلتر_العرض=$OLD (المطلوب 0)"
          echo "=== 4) ثيم الأوفلاين: خلفية ليست قاتمة ==="
          python3 - <<'PYEOF' || true
          import re
          s = open('app/src/main/assets/mapsforge/dark.xml', encoding='utf-8').read()
          bg = re.search(r'map-background="(#\w{6})"', s).group(1)
          land = re.search(r'<rule e="way" k="natural" v="nosea">\s*<area fill="(#\w{6})"', s)
          land = land.group(1) if land else '؟'
          val = int(bg[1:3], 16)
          msg = f"خلفية={bg}(سطوع {val}) أرض={land} قاتمة_جدا={'لا' if val >= 0x27 else 'نعم'}"
          print(msg); print(f"::error title=OFFLINE_THEME::{msg}")
          PYEOF
          echo "=== 5) أحجام العلامات وأسماء OSM ==="
          grep -nE "BUBBLE_LARGE_PX = |BUBBLE_MEDIUM_PX = |CIRCLE_PX = " $SRC/MarkerIconHelper.kt
          grep -n "getMarkerBitmapWithLabel" $SRC/MapScreen.kt | head -1
          echo "=== 6) داخل APK ==="
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          MATCH=$(unzip -l "$APK" | grep -E "assets/mapsforge/dark\.xml|map_style_night" || true)
          echo "$MATCH"
          echo "::error title=NIGHT_APK::$(echo "$MATCH" | tr '\n' '|')"
          echo "=== 7) لا تراجع: الشعارات ==="
          LOGOS=$(find app/build/generated/launcherIcons/res/drawable -name "logo_*_foreground.xml" | sed 's|.*/||' | tr '\n' ' ')
          IC=$(find app/build/generated/launcherIcons/res/mipmap-anydpi-v26 -name "*.xml" | wc -l)
          MERGED=$(find app/build/intermediates -name "AndroidManifest.xml" -path "*merged_manifest*" | head -1)
          AL=$(grep -c "<activity-alias" "$MERGED" || echo 0)
          echo "::error title=FINAL::شعارات=[$LOGOS] أيقونات=$IC aliases=$AL"

      - name: Prepare APK for upload
        if: success()
        run: |
          cp "$(find app/build/outputs/apk/debug -name '*.apk' | head -1)" ./MarketMaps-debug-arm64.apk
          ls -lh ./MarketMaps-debug-arm64.apk

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MarketMaps-debug-arm64-branch
          path: MarketMaps-debug-arm64.apk
          if-no-files-found: error
          retention-days: 14
