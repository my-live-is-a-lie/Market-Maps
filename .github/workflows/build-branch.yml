name: Build Debug APK (branch)

on:
  push:
    branches:
      - arena/01a0e716-market-maps

concurrency:
  group: build-branch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Inject Google Maps API key
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          if [ -z "$MAPS_API_KEY" ]; then
            echo "MAPS_API_KEY=" >> local.properties
          else
            echo "MAPS_API_KEY=$MAPS_API_KEY" >> local.properties
          fi

      - name: Build Debug APK (arm64-v8a only)
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace --no-daemon --build-cache 2>&1 | tee build.log

      - name: Report compile errors
        if: failure()
        run: |
          ERRS=$(grep -E "^e: |What went wrong" -A2 build.log | grep -vE "^\s+at " | head -60 || true)
          [ -z "$ERRS" ] && ERRS=$(tail -40 build.log)
          ERRS="${ERRS//'%'/'%25'}"; ERRS="${ERRS//$'\n'/'%0A'}"
          echo "::error title=Build failed::$ERRS"

      - name: "تحقق نهائي: مطابقة لوحة تطبيق جوجل الرسمي"
        if: always()
        run: |
          echo "=== 1) نمط جوجل: خضرة مزرقّة + مياه كحلية + أرض داكنة + تسميات بيضاء ==="
          python3 - <<'PYEOF' || true
          import json, colorsys
          d = json.load(open('app/src/main/res/raw/map_style_night.json', encoding='utf-8'))
          def color(f, e='geometry'):
              for r in d:
                  if r.get('featureType') == f and r.get('elementType') == e:
                      for st in r.get('stylers', []):
                          if 'color' in st: return st['color']
              return None
          def general(e):
              for r in d:
                  if 'featureType' not in r and r.get('elementType') == e:
                      for st in r.get('stylers', []):
                          if 'color' in st: return st['color']
              return None
          def hsv(c):
              r, g, b = (int(c[i:i+2], 16) / 255 for i in (1, 3, 5))
              h, s, v = colorsys.rgb_to_hsv(r, g, b)
              return h * 360, s, v
          def luma(c):
              return 0.2126 * int(c[1:3], 16) + 0.7152 * int(c[3:5], 16) + 0.0722 * int(c[5:7], 16)
          land = general('geometry'); label = general('labels.text.fill')
          veg = color('landscape.natural.landcover'); desert = color('landscape.natural')
          park = color('poi.park'); water = color('water')
          road = color('road'); highway = color('road.highway')
          vh, vs, _ = hsv(veg); wh, ws, wv = hsv(water); ph, ps, _ = hsv(park)
          checks = {
              'خضرة_مزرقّة': 150 <= vh <= 190 and vs >= 0.40,
              'مياه_كحلية': 200 <= wh <= 230 and wv <= 0.50,
              'أرض_داكنة': luma(land) <= 40,
              'تسميات_بيضاء': luma(label) >= 230,
              'طرق_أفتح_من_الأرض': luma(road) > luma(land) + 25,
              'طرق_رئيسية_أفتح': luma(highway) > luma(road),
              'حدائق_كالأخضر': 150 <= ph <= 190 and ps >= 0.40,
          }
          failed = [k for k, v in checks.items() if not v]
          msg = (f"قواعد={len(d)} أرض={land}(إضاءة{luma(land):.0f}) خضرة={veg}({vh:.0f}°,{vs*100:.0f}%) "
                 f"صحارى={desert} حدائق={park}({ph:.0f}°,{ps*100:.0f}%) مياه={water}({wh:.0f}°,{wv*100:.0f}%) "
                 f"شوارع={road}(إضاءة{luma(road):.0f}) رئيسية={highway}(إضاءة{luma(highway):.0f}) تسميات={label}(إضاءة{luma(label):.0f}) "
                 f"فاشل={failed or 'لا شيء'}")
          print(msg)
          print(f"::error title=GOOGLE_PALETTE::{msg}")
          PYEOF
          echo "=== 2) ثيم OSM الأوفلاين بنفس اللوحة الرسمية ==="
          python3 - <<'PYEOF' || true
          import re
          s = open('app/src/main/assets/mapsforge/dark.xml', encoding='utf-8').read()
          need = {'أرض': '#1B2531', 'شوارع': '#3F5261', 'إطار': '#16202C', 'مياه': '#11304C',
                  'خضرة': '#1D4239', 'حدائق': '#1F4A3E', 'تسميات': '#FFFFFF'}
          missing = [k for k, v in need.items() if v.upper() not in s.upper()]
          stale = [c for c in ['#242F3E', '#17639B', '#2E7D4F', '#2C6242', '#46505F', '#E8EAED']
                   if c.upper() in s.upper()]
          msg = f"مفقود={missing or 'لا شيء'} ألوان_قديمة={stale or 'لا شيء'}"
          print(msg); print(f"::error title=OFFLINE_THEME::{msg}")
          PYEOF
          echo "=== 3) تلوين بلاطات OSM أونلاين (محاكاة Mapnik) ==="
          python3 - <<'PYEOF' || true
          import re, colorsys
          code = open('app/src/main/java/com/marketmaps/app/ui/map/NightTileCache.kt', encoding='utf-8').read()
          nums = [int(x) for x in re.findall(r'-?\d+', re.search(r'CONTROL = intArrayOf\((.*?)\)', code, re.S).group(1))]
          ctrl = [(nums[i], nums[i + 1]) for i in range(0, len(nums), 2)]
          lut = []
          for i in range(256):
              q = 0
              while q < len(ctrl) - 2 and ctrl[q + 1][0] < i: q += 1
              x0, y0 = ctrl[q]; x1, y1 = ctrl[q + 1]
              lut.append(y1 if x1 <= x0 else y0 + (y1 - y0) * (i - x0) // (x1 - x0))
          sp = int(re.search(r'LOW_CHROMA_SPREAD = (\d+)', code).group(1))
          bb = int(re.search(r'BLUE_BIAS = (\d+)', code).group(1))
          gb = int(re.search(r'GREEN_BIAS = (\d+)', code).group(1))
          cr = int(re.search(r'COOL_R = (-?\d+)', code).group(1))
          cb = int(re.search(r'COOL_B = (\d+)', code).group(1))
          def apply(hx):
              r, g, b = (int(hx[i:i+2], 16) for i in (1, 3, 5))
              y = (r * 77 + g * 150 + b * 29) >> 8
              if max(r, g, b) - min(r, g, b) < sp:
                  t = lut[max(0, min(255, y))]
                  return (max(0, min(255, t + cr)), t, max(0, min(255, t + cb)))
              f = max(0.75, min(1.3, y / 190))
              if b - r > bb: return (int(17 * f), int(48 * f), int(76 * f))
              if g - r > gb: return (int(29 * f), int(66 * f), int(57 * f))
              w = max(0.85, min(1.1, y / 200))
              return (int(85 * w), int(108 * w), int(122 * w))
          def hx(t): return '#%02X%02X%02X' % t
          def lum(t): return 0.2126 * t[0] + 0.7152 * t[1] + 0.0722 * t[2]
          def hsv(t):
              h, s, v = colorsys.rgb_to_hsv(t[0] / 255, t[1] / 255, t[2] / 255); return h * 360, s, v
          o = {k: apply(v) for k, v in {'أرض': '#F2EFE9', 'شارع': '#FFFFFF', 'نص': '#202020',
                                        'مياه': '#AAD3DF', 'غابة': '#ADD19E'}.items()}
          wh, ws, wv = hsv(o['مياه']); gh, gs, _ = hsv(o['غابة'])
          ok = (200 <= wh <= 230 and wv <= 0.55) and (150 <= gh <= 190 and gs >= 0.40) \
               and lum(o['نص']) >= 230 and lum(o['شارع']) > lum(o['أرض']) + 25
          msg = (f"أرض={hx(o['أرض'])}({lum(o['أرض']):.0f}) شارع={hx(o['شارع'])}({lum(o['شارع']):.0f}) "
                 f"نص={hx(o['نص'])}({lum(o['نص']):.0f}) مياه={hx(o['مياه'])}({wh:.0f}°,{wv*100:.0f}%) "
                 f"خضرة={hx(o['غابة'])}({gh:.0f}°,{gs*100:.0f}%) مطابقة_الرسمي={'نعم' if ok else 'لا'}")
          print(msg); print(f"::error title=OSM_TILES::{msg}")
          PYEOF
          echo "=== 4) داخل APK + الشعارات ==="
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          MATCH=$(unzip -l "$APK" | grep -E "assets/mapsforge/dark\.xml|map_style_night" || true)
          echo "$MATCH"; echo "::error title=NIGHT_APK::$(echo "$MATCH" | tr '\n' '|')"
          LOGOS=$(find app/build/generated/launcherIcons/res/drawable -name "logo_*_foreground.xml" | sed 's|.*/||' | tr '\n' ' ')
          IC=$(find app/build/generated/launcherIcons/res/mipmap-anydpi-v26 -name "*.xml" | wc -l)
          MERGED=$(find app/build/intermediates -name "AndroidManifest.xml" -path "*merged_manifest*" | head -1)
          AL=$(grep -c "<activity-alias" "$MERGED" || echo 0)
          echo "::error title=FINAL::شعارات=[$LOGOS] أيقونات=$IC aliases=$AL"

      - name: Prepare APK for upload
        if: success()
        run: |
          cp "$(find app/build/outputs/apk/debug -name '*.apk' | head -1)" ./MarketMaps-debug-arm64.apk
          ls -lh ./MarketMaps-debug-arm64.apk

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MarketMaps-debug-arm64-branch
          path: MarketMaps-debug-arm64.apk
          if-no-files-found: error
          retention-days: 14
