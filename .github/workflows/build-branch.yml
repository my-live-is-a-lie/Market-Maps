name: Build Debug APK (branch)

on:
  push:
    branches:
      - arena/01a0e716-market-maps

concurrency:
  group: build-branch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Inject Google Maps API key
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          if [ -z "$MAPS_API_KEY" ]; then
            echo "MAPS_API_KEY=" >> local.properties
          else
            echo "MAPS_API_KEY=$MAPS_API_KEY" >> local.properties
          fi

      - name: Build Debug APK (arm64-v8a only)
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace --no-daemon --build-cache 2>&1 | tee build.log

      - name: Report compile errors
        if: failure()
        run: |
          ERRS=$(grep -E "^e: |What went wrong" -A2 build.log | grep -vE "^\s+at " | head -60 || true)
          [ -z "$ERRS" ] && ERRS=$(tail -40 build.log)
          ERRS="${ERRS//'%'/'%25'}"; ERRS="${ERRS//$'\n'/'%0A'}"
          echo "::error title=Build failed::$ERRS"
      - name: "تحقق نهائي: النمط الليلي الرسمي من جوجل (نمط + بلاطات OSM + ثيم OSM)"
        if: always()
        run: |
          echo "=== 1) مطابقة النمط الرسمي لجوجل + تحويل بلاطات OSM + الألوان في ثيم OSM ==="
          python3 - <<'PYEOF' || true
          import json, re, sys

          official = [
           ("all", "geometry", ("color", "#242f3e")),
           ("all", "labels.text.stroke", ("lightness", -80)),
           ("administrative", "labels.text.fill", ("color", "#746855")),
           ("administrative.locality", "labels.text.fill", ("color", "#d59563")),
           ("poi", "labels.text.fill", ("color", "#d59563")),
           ("poi.park", "geometry", ("color", "#263c3f")),
           ("poi.park", "labels.text.fill", ("color", "#6b9a76")),
           ("road", "geometry.fill", ("color", "#2b3544")),
           ("road", "labels.text.fill", ("color", "#9ca5b3")),
           ("road.arterial", "geometry.fill", ("color", "#38414e")),
           ("road.arterial", "geometry.stroke", ("color", "#212a37")),
           ("road.highway", "geometry.fill", ("color", "#746855")),
           ("road.highway", "geometry.stroke", ("color", "#1f2835")),
           ("road.highway", "labels.text.fill", ("color", "#f3d19c")),
           ("road.local", "geometry.fill", ("color", "#38414e")),
           ("road.local", "geometry.stroke", ("color", "#212a37")),
           ("transit", "geometry", ("color", "#2f3948")),
           ("transit.station", "labels.text.fill", ("color", "#d59563")),
           ("water", "geometry", ("color", "#17263c")),
           ("water", "labels.text.fill", ("color", "#515c6d")),
           ("water", "labels.text.stroke", ("lightness", -20)),
          ]
          palette = {"#242f3e", "#263c3f", "#2b3544", "#38414e", "#212a37", "#746855",
                     "#1f2835", "#f3d19c", "#2f3948", "#d59563", "#6b9a76", "#17263c", "#515c6d", "#9ca5b3"}
          d = json.load(open('app/src/main/res/raw/map_style_night.json', encoding='utf-8'))
          got = []
          for r in d:
              st = r['stylers'][0]
              k, v = list(st.items())[0]
              got.append((r.get('featureType', 'all'), r.get('elementType', 'geometry'), (k, v)))
          missing = [o for o in official if o not in got]
          extra = [g for g in got if g not in official]
          outside = sorted({v.lower() for (_, _, (k, v)) in got if k == 'color'} - palette)

          code = open('app/src/main/java/com/marketmaps/app/ui/map/NightTileCache.kt', encoding='utf-8').read()
          nums = [int(x) for x in re.findall(r'-?\d+', re.search(r'CONTROL = intArrayOf\((.*?)\)', code, re.S).group(1))]
          pts = [(nums[i], nums[i + 1], nums[i + 2], nums[i + 3]) for i in range(0, len(nums), 4)]
          def lerp(i):
              p = 0
              while p < len(pts) - 1 and pts[p + 1][0] < i:
                  p += 1
              x0, r0, g0, b0 = pts[p]
              x1, r1, g1, b1 = pts[p + 1]
              span = x1 - x0
              if span <= 0:
                  return (r1, g1, b1)
              t = max(0, min(span, i - x0))
              return (r0 + (r1 - r0) * t // span, g0 + (g1 - g0) * t // span, b0 + (b1 - b0) * t // span)
          lut = [lerp(i) for i in range(256)]
          sp = int(re.search(r'LOW_CHROMA_SPREAD = (\d+)', code).group(1))
          bb = int(re.search(r'BLUE_BIAS = (\d+)', code).group(1))
          gb = int(re.search(r'GREEN_BIAS = (\d+)', code).group(1))
          wb = int(re.search(r'WARM_BIAS = (\d+)', code).group(1))
          WATER = int(re.search(r'WATER = 0x([0-9A-Fa-f]{6})', code).group(1), 16)
          PARK = int(re.search(r'PARK = 0x([0-9A-Fa-f]{6})', code).group(1), 16)
          HIGHWAY = int(re.search(r'HIGHWAY = 0x([0-9A-Fa-f]{6})', code).group(1), 16)
          def trip(c):
              return (c >> 16) & 255, (c >> 8) & 255, c & 255
          def apply(hx):
              r, g, b = (int(hx[i:i + 2], 16) for i in (1, 3, 5))
              y = (r * 77 + g * 150 + b * 29) >> 8
              if max(r, g, b) - min(r, g, b) < sp:
                  return lut[max(0, min(255, y))]
              if b - r > bb:
                  return trip(WATER)
              if g - r > gb:
                  return trip(PARK)
              if r - b > wb:
                  return trip(HIGHWAY)
              return lut[max(0, min(255, y))]
          def hx(t):
              return '#%02X%02X%02X' % t
          cases = [('أرض', '#F2EFE9', '#242F3E'), ('مياه', '#AAD3DF', '#17263C'), ('خضرة', '#ADD19E', '#263C3F'),
                   ('طريق_سريع', '#FCD6A4', '#746855'), ('شارع_أبيض', '#FFFFFF', '#38414E'), ('نص', '#333333', '#9CA5B3')]
          detail = []
          tiles_fail = []
          for name, src, want in cases:
              gotc = hx(apply(src))
              detail.append(f"{name}={gotc}")
              if gotc.upper() != want.upper():
                  tiles_fail.append(name)
          tiles_ok = not tiles_fail
          for name, src, want in cases:
              print(f"   تحويل {name}: {src} → {hx(apply(src))} (المطلوب {want})")

          s = open('app/src/main/assets/mapsforge/dark.xml', encoding='utf-8').read()
          active = re.sub(r'<!--.*?-->', '', s, flags=re.S)
          cols = sorted({x.upper() for x in re.findall(r'#([0-9A-Fa-f]{6})', active)})
          allowed = {"242F3E", "17263C", "263C3F", "2B3544", "38414E", "746855",
                     "212A37", "1F2835", "2F3948", "9CA5B3", "515C6D", "D59563", "6B9A76", "F3D19C"}
          theme_outside = [c for c in cols if c not in allowed]
          need = {"أرض_ليلية": "#242F3E", "مياه_ليلية": "#17263C", "خضرة_ليلية": "#263C3F",
                  "شوارع_ليلية": "#38414E", "طرق_سريعة_ليلية": "#746855"}
          missing_theme = [k for k, v in need.items() if v.lstrip("#").upper() not in cols]
          old = {"#1B2531", "#BFE0B4", "#C6E5BE", "#A2CBE6", "#3F5261", "#556C7A", "#16202C", "#4A5F6F", "#3A4C5A"}
          leftover = sorted(x for x in old if x.lstrip("#").upper() in cols)

          failed = []
          if missing or extra or outside:
              failed.append('النمط الرسمي')
          if not tiles_ok:
              failed.append('بلاطات OSM')
          if theme_outside or missing_theme or leftover:
              failed.append('ثيم OSM')

          print(f"النمط الرسمي: قواعد={len(d)}/{len(official)} مفقود={len(missing)} زائد={len(extra)}")
          print(f"بلاطات OSM: مطابق={'نعم' if tiles_ok else 'لا'} ({detail})")
          print(f"ثيم OSM: خارج_اللوحة={theme_outside or 'لا شيء'} مفقود={missing_theme or 'لا شيء'} بقايا={leftover or 'لا شيء'}")

          for t, m in (('GOOGLE_OFFICIAL', f"قواعد={len(d)}/{len(official)} أرض=#242F3E مياه=#17263C خضرة=#263C3F سريع=#746855 مفقود={len(missing)} زائد={len(extra)} خارج_اللوحة={outside or 'لا شيء'}"),
                       ('OSM_TILES', f"{' '.join(detail)} مطابق={'نعم' if tiles_ok else 'لا'}"),
                       ('OFFLINE_THEME', f"خارج_اللوحة={theme_outside or 'لا شيء'} مفقود={missing_theme or 'لا شيء'} بقايا_قديمة={leftover or 'لا شيء'}")):
              print(f"::error title={t}::{m}")

          sys.exit(0 if not failed else 1)
          PYEOF
          echo "=== 2) داخل APK + الشعارات ==="
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          MATCH=$(unzip -l "$APK" | grep -E "assets/mapsforge/dark\.xml|map_style_night" || true)
          echo "$MATCH"; echo "::error title=NIGHT_APK::$(echo "$MATCH" | tr '\n' '|')"
          LOGOS=$(find app/build/generated/launcherIcons/res/drawable -name "logo_*_foreground.xml" | sed 's|.*/||' | tr '\n' ' ')
          IC=$(find app/build/generated/launcherIcons/res/mipmap-anydpi-v26 -name "*.xml" | wc -l)
          MERGED=$(find app/build/intermediates -name "AndroidManifest.xml" -path "*merged_manifest*" | head -1)
          AL=$(grep -c "<activity-alias" "$MERGED" || echo 0)
          echo "::error title=FINAL::شعارات=[$LOGOS] أيقونات=$IC aliases=$AL"

      - name: Prepare APK for upload
        if: success()
        run: |
          cp "$(find app/build/outputs/apk/debug -name '*.apk' | head -1)" ./MarketMaps-debug-arm64.apk
          ls -lh ./MarketMaps-debug-arm64.apk

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MarketMaps-debug-arm64-branch
          path: MarketMaps-debug-arm64.apk
          if-no-files-found: error
          retention-days: 14

