name: Build Debug APK (branch)

# سير عمل مؤقت: نفس خطوات Build Debug APK لكن يعمل تلقائياً على فرع المراجعة
on:
  push:
    branches:
      - arena/01a0e716-market-maps

concurrency:
  group: build-branch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Inject Google Maps API key
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          if [ -z "$MAPS_API_KEY" ]; then
            echo "تحذير: لم يتم العثور على Secret باسم MAPS_API_KEY — خرائط جوجل لن تعمل"
            echo "MAPS_API_KEY=" >> local.properties
          else
            echo "MAPS_API_KEY=$MAPS_API_KEY" >> local.properties
            echo "تم حقن مفتاح API (الطول: ${#MAPS_API_KEY})"
          fi
          if [ -f app/debug.keystore ]; then
            echo "===== SHA-1 Debug (أضفه في Google Cloud Console) ====="
            keytool -list -v -keystore app/debug.keystore -storepass android -alias androiddebugkey 2>/dev/null | grep -E "SHA1:|SHA256:" || true
            echo "======================================================"
          fi

      - name: Build Debug APK (arm64-v8a only)
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace --no-daemon --build-cache 2>&1 | tee build.log

      - name: Report compile errors
        if: failure()
        run: |
          ERRS=$(grep -E "^e: |What went wrong" -A2 build.log | grep -vE "^\s+at " | head -60 || true)
          [ -z "$ERRS" ] && ERRS=$(tail -40 build.log)
          ERRS="${ERRS//'%'/'%25'}"; ERRS="${ERRS//$'\n'/'%0A'}"
          echo "::error title=Build failed::$ERRS"

      - name: "تحقق نهائي: الوضع الليلي + الشعارات"
        if: always()
        run: |
          echo "=== 1) ثيم الأوفلاين الليلي ==="
          ls -l app/src/main/assets/mapsforge/dark.xml || true
          python3 - <<'PYEOF' || true
          import re, xml.etree.ElementTree as ET
          s = open('app/src/main/assets/mapsforge/dark.xml', encoding='utf-8').read()
          cleaned = re.sub(r'<!--.*?-->', '', s, flags=re.S)
          ET.fromstring(cleaned)
          supported = {'rendertheme','rule','area','caption','circle','line','pathText',
                       'stylemenu','symbol','lineSymbol','hillshading','cat','layer','name','overlay'}
          tags = set(re.findall(r'<([a-zA-Z][\w-]*)', cleaned))
          extra = sorted(tags - supported)
          bg = re.search(r'map-background="(#[0-9A-Fa-f]{6})"', s).group(1)
          msg = f"THEME=سليم عناصر={len(tags)} خارج_المدعوم={extra or 'لا شيء'} خلفية={bg}"
          print(msg)
          print(f"::error title=NIGHT_THEME::{msg}")
          PYEOF
          echo "=== 2) نمط خرائط جوجل الليلي ==="
          ls -l app/src/main/res/raw/map_style_night.json || true
          python3 - <<'PYEOF' || true
          import json
          d = json.load(open('app/src/main/res/raw/map_style_night.json', encoding='utf-8'))
          msg = f"GOOGLE_STYLE=صحيح قواعد={len(d)}"
          print(msg)
          print(f"::error title=NIGHT_STYLE::{msg}")
          PYEOF
          echo "=== 3) وجود الموارد داخل APK ==="
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          echo "APK=$APK"
          MATCH=$(unzip -l "$APK" | grep -E "assets/mapsforge/dark\.xml|map_style_night" || true)
          echo "$MATCH"
          COUNT=$(echo "$MATCH" | grep -c . || true)
          echo "::error title=NIGHT_APK::عدد_الموارد=$COUNT سطور=[$(echo "$MATCH" | tr '\n' '|')]"
          test "$COUNT" -ge 2
          echo "=== 4) الأدلة السابقة (الشعارات — لا تراجع) ==="
          LOGOS=$(find app/build/generated/launcherIcons/res/drawable -name "logo_*_foreground.xml" | sed 's|.*/||' | tr '\n' ' ')
          IC=$(find app/build/generated/launcherIcons/res/mipmap-anydpi-v26 -name "*.xml" | wc -l)
          MERGED=$(find app/build/intermediates -name "AndroidManifest.xml" -path "*merged_manifest*" | head -1)
          AL=$(grep -c "<activity-alias" "$MERGED" || echo 0)
          echo "::error title=FINAL::شعارات=[$LOGOS] أيقونات=$IC aliases=$AL"

      - name: Prepare APK for upload
        if: success()
        run: |
          cp "$(find app/build/outputs/apk/debug -name '*.apk' | head -1)" ./MarketMaps-debug-arm64.apk
          ls -lh ./MarketMaps-debug-arm64.apk

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MarketMaps-debug-arm64-branch
          path: MarketMaps-debug-arm64.apk
          if-no-files-found: error
          retention-days: 14
