name: Patch Search Chip Match

on:
  push:
    paths:
      - 'scripts/patch_search_chip_match.py'
      - '.github/workflows/patch-search-chip-match.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/patch_search_chip_match.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/marketmaps/app/ui/map/SearchBar.kt
          git diff --staged --stat
          git commit -m "UI: تكبير زر الفلتر المطابق 10٪ وتمريره لوسط الشريط عند البحث" || true
          git push
