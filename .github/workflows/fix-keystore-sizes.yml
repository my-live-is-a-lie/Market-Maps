name: Fix Keystore And Marker Sizes

on:
  push:
    paths:
      - 'scripts/write_keystore.py'
      - 'scripts/reduce_marker_sizes.py'
      - 'scripts/patch_gradle_debug.py'
      - 'scripts/patch_build_yml.py'
      - '.github/workflows/fix-keystore-sizes.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/write_keystore.py
      - run: python3 scripts/patch_gradle_debug.py
      - run: python3 scripts/reduce_marker_sizes.py
      - run: python3 scripts/patch_build_yml.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/debug.keystore app/build.gradle.kts \
                  app/src/main/java/com/marketmaps/app/ui/map/MarkerIconHelper.kt \
                  .github/workflows/build.yml
          git status
          git commit -m "fix: keystore debug ثابت + تصغير أيقونات الأماكن" || true
          git push
