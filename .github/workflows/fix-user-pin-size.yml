name: Enlarge User Pin

on:
  push:
    paths:
      - 'scripts/patch_user_pin_size.py'
      - '.github/workflows/fix-user-pin-size.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/patch_user_pin_size.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/marketmaps/app/ui/map/MarkerIconHelper.kt
          git diff --staged --stat
          git commit -m "UI: تكبير أيقونة الموقع الحالي (64→80)" || true
          git push
