name: Fix Import Absolute Padding

on:
  push:
    paths:
      - '.github/workflows/fix-import-absolute-padding.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add absolutePadding import
        run: |
          python3 -c "
          from pathlib import Path
          p = Path('app/src/main/java/com/marketmaps/app/ui/map/MapScreen.kt')
          c = p.read_text(encoding='utf-8')
          if 'import androidx.compose.foundation.layout.absolutePadding' in c:
              print('Import already present')
          else:
              old = 'import androidx.compose.foundation.layout.padding\n'
              new = 'import androidx.compose.foundation.layout.padding\nimport androidx.compose.foundation.layout.absolutePadding\n'
              if old not in c:
                  raise SystemExit('padding import not found')
              c = c.replace(old, new, 1)
              p.write_text(c, encoding='utf-8')
              print('Import added')
          # تأكيد استخدام absolutePadding في الموضع الصحيح
          if '.absolutePadding(left = 12.dp, bottom = navBottomPad)' not in c:
              c = p.read_text(encoding='utf-8')
              for bad in [
                  '.padding(left = 12.dp, bottom = navBottomPad)',
                  '.padding(start = 12.dp, bottom = navBottomPad)',
              ]:
                  if bad in c and 'AbsoluteAlignment.BottomLeft' in c:
                      c = c.replace(bad, '.absolutePadding(left = 12.dp, bottom = navBottomPad)', 1)
                      p.write_text(c, encoding='utf-8')
                      print('Also fixed call site')
                      break
          "

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/marketmaps/app/ui/map/MapScreen.kt
          git diff --staged --stat
          git commit -m "fix: استيراد absolutePadding لإصلاح خطأ الترجمة" || true
          git push
